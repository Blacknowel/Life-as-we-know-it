<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Benin Life</title>
<style>
:root{--gold:#f7c948;--dark:#14211d;--panel:#20342d;--cream:#fff8e7}*{box-sizing:border-box}body{margin:0;background:#101a17;color:var(--cream);font-family:system-ui,Arial,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none;background:#9dbb7c}#hud{position:fixed;inset:10px 10px auto 10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.pill,.panel{background:#14211de8;border:1px solid #ffffff24;border-radius:14px;padding:9px 12px;box-shadow:0 5px 20px #0003}.pill{font-size:13px;line-height:1.4}.pill strong{color:var(--gold)}#rightHud{display:flex;gap:6px;pointer-events:auto}button{border:0;border-radius:12px;background:var(--gold);color:#17221c;font-weight:800;padding:10px 12px;font-size:14px;cursor:pointer;touch-action:manipulation}button.secondary{background:#30483e;color:white;border:1px solid #ffffff22}#bottom{position:fixed;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:45px 45px 45px;gap:4px;pointer-events:auto}.pad button{padding:0;background:#14211dd9;color:white;font-size:20px;border:1px solid #ffffff35}.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:flex;flex-direction:column;gap:7px;pointer-events:auto;align-items:flex-end}.actions button{min-width:92px;box-shadow:0 4px 12px #0003}#toast{position:fixed;left:50%;top:86px;transform:translateX(-50%);max-width:88vw;text-align:center;background:#14211df2;padding:10px 15px;border-radius:12px;display:none;border:1px solid #ffffff2b;font-size:14px}#modalWrap{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}#modal{width:min(480px,100%);max-height:82dvh;overflow:auto;background:#182a23;border:1px solid #ffffff28;border-radius:20px;padding:18px;box-shadow:0 20px 80px #0008}#modal h2{margin:0 0 6px;color:var(--gold)}#modal p{color:#d7e2d9;font-size:14px;line-height:1.5}#choices{display:grid;gap:8px;margin-top:12px}#choices button{text-align:left}#close{float:right;background:#30483e;color:white}#hint{font-size:12px;color:#c7d5ca;margin-top:8px}@media(min-width:800px){.pad{opacity:.85}.pill{font-size:14px}}
</style></head>
<body><canvas id="game"></canvas>
<div id="hud"><div class="pill">📍 <strong>BENIN LIFE</strong><br><span id="place">Uselu Road</span></div><div class="pill">💵 <strong id="cash">₦25,000</strong><br>💼 <span id="job">Unemployed</span></div><div id="rightHud"><button class="secondary" id="phoneBtn">📱 Phone</button><button class="secondary" id="mapBtn">🗺️ Map</button></div></div>
<div id="toast"></div>
<div id="bottom"><div class="pad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><div class="actions"><button id="interactBtn">INTERACT</button><button class="secondary" id="runBtn">🏃 Run: OFF</button></div></div>
<div id="modalWrap"><div id="modal"><button id="close">✕</button><h2 id="modalTitle">Benin Life</h2><p id="modalText"></p><div id="choices"></div><div id="hint">Tip: Walk close to a building and press INTERACT.</div></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const state={x:0,y:0,cash:25000,job:'Unemployed',run:false,car:false,house:false,business:false,day:1,rep:0,phone:false};const keys={};let toastTimer;function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2300)}
const buildings=[
{x:-300,y:-230,w:150,h:100,name:'Uselu Market',type:'market',color:'#d9a441',desc:'A busy market with traders, food stalls, and business opportunities.'},
{x:40,y:-250,w:155,h:120,name:'City Hall',type:'office',color:'#d8d5c9',desc:'A place to look for formal work and public service opportunities.'},
{x:350,y:-210,w:140,h:105,name:'Oredo Police Station',type:'police',color:'#c9d8d9',desc:'The local police station. You can report a problem or apply for police work.'},
{x:-330,y:90,w:145,h:105,name:'Edo Cafe',type:'cafe',color:'#c76e48',desc:'Grab a snack, meet people, and hear the latest city gossip.'},
{x:-30,y:110,w:150,h:110,name:'Benin Bank',type:'bank',color:'#9dc1a0',desc:'Manage your savings and plan your next big purchase.'},
{x:280,y:100,w:165,h:120,name:'Property Office',type:'property',color:'#d8bb91',desc:'Find a place to live or buy a home.'},
{x:-250,y:350,w:160,h:100,name:'Motor Park',type:'park',color:'#b8a08a',desc:'A lively transport hub. Find work and plan your trips around town.'},
{x:100,y:360,w:160,h:105,name:'Business Centre',type:'business',color:'#b7c9d7',desc:'Start a small business and work toward becoming a local entrepreneur.'},
{x:390,y:350,w:150,h:100,name:'Government House',type:'gov',color:'#e4d9bf',desc:'A landmark for public service and civic leadership.'}
];
const trees=[];for(let i=0;i<60;i++){let x=((i*173)%1500)-750,y=((i*257)%1300)-650;if(!buildings.some(b=>x>b.x-40&&x<b.x+b.w+40&&y>b.y-40&&y<b.y+b.h+40))trees.push({x,y,r:10+(i%8)})}
const roads=[{x:-900,y:-45,w:1800,h:80},{x:-55,y:-800,w:85,h:1600},{x:-900,y:270,w:1800,h:65},{x:230,y:-800,w:70,h:1600}];
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#9dbb7c';ctx.fillRect(0,0,W,H);let scale=Math.min(W/800,H/600);scale=Math.max(.72,Math.min(scale,1.15));const camX=state.x,camY=state.y;ctx.save();ctx.translate(W/2-camX,H/2-camY);ctx.scale(scale,scale);ctx.translate(camX,camY);
// grass texture
ctx.fillStyle='#91b475';for(let x=-900;x<900;x+=44)for(let y=-800;y<800;y+=44){ctx.fillRect(x+((y/44)%2)*12,y,2,2)}
// roads
for(const r of roads){ctx.fillStyle='#777b77';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#c9c6a8';if(r.h<r.w){for(let x=r.x;x<r.x+r.w;x+=50)ctx.fillRect(x,r.y+r.h/2-2,25,4)}else{for(let y=r.y;y<r.y+r.h;y+=50)ctx.fillRect(r.x+r.w/2-2,y,4,25)}}
// trees
for(const t of trees){ctx.fillStyle='#6a4b31';ctx.fillRect(t.x-3,t.y+4,6,12);ctx.fillStyle='#427a43';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#609653';ctx.beginPath();ctx.arc(t.x-4,t.y-4,t.r*.55,0,Math.PI*2);ctx.fill()}
// small houses
for(let i=0;i<22;i++){let x=-720+(i*137)%1400,y=-680+(i*197)%1350;if(!buildings.some(b=>x>b.x-65&&x<b.x+b.w+35&&y>b.y-65&&y<b.y+b.h+35)&&!roads.some(r=>x>r.x-10&&x<r.x+r.w+10&&y>r.y-10&&y<r.y+r.h+10)){ctx.fillStyle='#b96e52';ctx.fillRect(x,y,52,40);ctx.fillStyle='#7d4435';ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+26,y-18);ctx.lineTo(x+57,y);ctx.closePath();ctx.fill();ctx.fillStyle='#5e9aab';ctx.fillRect(x+8,y+12,10,10)}}
// buildings
for(const b of buildings){ctx.fillStyle='#0002';ctx.fillRect(b.x+6,b.y+8,b.w,b.h);ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#6f5945';ctx.fillRect(b.x-5,b.y-9,b.w+10,14);ctx.fillStyle='#fff7db';ctx.fillRect(b.x+12,b.y+22,25,20);ctx.fillRect(b.x+b.w-38,b.y+22,25,20);ctx.fillStyle='#594c3b';ctx.fillRect(b.x+b.w/2-12,b.y+b.h-34,24,34);ctx.fillStyle='#1a2922';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(b.name,b.x+b.w/2,b.y+b.h+17);ctx.fillStyle='#fff8e7';ctx.font='11px system-ui';ctx.fillText('●',b.x+b.w/2,b.y-15)}
// player shadow + character
ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(state.x,state.y+13,12,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5c3827';ctx.beginPath();ctx.arc(state.x,state.y-10,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(state.x-8,state.y-2,16,19);ctx.fillStyle='#f0c9a4';ctx.fillRect(state.x-5,state.y-8,10,12);ctx.fillStyle='#f4c542';ctx.fillRect(state.x-9,state.y-2,18,5);ctx.fillStyle='#1c2923';ctx.fillRect(state.x-7,state.y+15,5,8);ctx.fillRect(state.x+2,state.y+15,5,8);
ctx.restore();requestAnimationFrame(draw)}draw();
function nearBuilding(){let best=null,dist=Infinity;for(const b of buildings){let cx=b.x+b.w/2,cy=b.y+b.h/2,d=Math.hypot(state.x-cx,state.y-cy);if(d<dist){best=b;dist=d}}return dist<105?best:null}
function updateHUD(){document.getElementById('cash').textContent='₦'+state.cash.toLocaleString('en-NG');document.getElementById('job').textContent=state.job;let b=nearBuilding();document.getElementById('place').textContent=b?b.name:(Math.abs(state.x)<200&&Math.abs(state.y)<200?'City Centre':'Benin City');document.getElementById('interactBtn').textContent=b?'INTERACT: '+b.name.split(' ')[0].toUpperCase():'INTERACT'}setInterval(updateHUD,250);
function move(dx,dy){let speed=state.run?5.2:3.2;let nx=state.x+dx*speed,ny=state.y+dy*speed;state.x=Math.max(-820,Math.min(820,nx));state.y=Math.max(-740,Math.min(740,ny))}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='e'||e.key==='Enter')interact();if(e.key.toLowerCase()==='m')showMap()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loopMove(){let dx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0),dy=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);if(dx||dy){let len=Math.hypot(dx,dy);move(dx/len,dy/len)}requestAnimationFrame(loopMove)}loopMove();
document.querySelectorAll('[data-move]').forEach(btn=>{let dx=0,dy=0;btn.addEventListener('pointerdown',e=>{e.preventDefault();let m=btn.dataset.move;keys['touch_'+m]=true;btn.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>keys['touch_'+btn.dataset.move]=false));});const oldLoop=loopMove; // touch movement handled here
(function touchLoop(){let dx=(keys['touch_right']?1:0)-(keys['touch_left']?1:0),dy=(keys['touch_down']?1:0)-(keys['touch_up']?1:0);if(dx||dy){let len=Math.hypot(dx,dy);move(dx/len,dy/len)}requestAnimationFrame(touchLoop)})();
document.getElementById('runBtn').onclick=()=>{state.run=!state.run;document.getElementById('runBtn').textContent='🏃 Run: '+(state.run?'ON':'OFF')};
const wrap=document.getElementById('modalWrap'),title=document.getElementById('modalTitle'),textEl=document.getElementById('modalText'),choices=document.getElementById('choices');function openModal(t,desc,opts){title.textContent=t;textEl.textContent=desc;choices.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.className=o.secondary?'secondary':'';b.onclick=()=>{o.action();if(o.keepOpen){openModal(t,desc,opts)}else closeModal()};choices.appendChild(b)});wrap.style.display='flex'}function closeModal(){wrap.style.display='none'}document.getElementById('close').onclick=closeModal;wrap.addEventListener('click',e=>{if(e.target===wrap)closeModal()});
function doWork(role,pay){if(state.job===role){state.cash+=pay;state.rep++;toast('Shift completed! You earned ₦'+pay.toLocaleString()+'.');return}state.job=role;toast('You got a job as '+role+'! Return here to work and earn money.')}
function interact(){let b=nearBuilding();if(!b){toast('Move closer to a building, then press INTERACT.');return}let opts=[];if(b.type==='office'){opts=[{label:'Apply for civil servant job',action:()=>doWork('Civil Servant',12000)},{label:'Work a shift (+₦12,000)',action:()=>state.job==='Civil Servant'?(state.cash+=12000,toast('You earned ₦12,000 for your shift.')):toast('Apply for the job first!')},{label:'Ask about city services',secondary:true,action:()=>toast('Visit City Hall for public services and local information.')}]}else if(b.type==='market'){opts=[{label:'Buy groceries (₦2,000)',action:()=>{if(state.cash>=2000){state.cash-=2000;toast('Groceries bought. You feel prepared for the day.')}else toast('Not enough money. Find a job first.')}},{label:'Become a market trader',action:()=>doWork('Market Trader',8000)},{label:'Sell goods (+₦5,000)',action:()=>{if(state.job==='Market Trader'){state.cash+=5000;toast('Sales made! You earned ₦5,000.')}else toast('Become a market trader first.')}}]}else if(b.type==='police'){opts=[{label:'Apply to be a police officer',action:()=>doWork('Police Officer',11000)},{label:'Report a problem',action:()=>toast('Your report has been recorded. Stay safe around town.') }]}else if(b.type==='cafe'){opts=[{label:'Buy a meal (₦1,500)',action:()=>{if(state.cash>=1500){state.cash-=1500;toast('You enjoyed a local meal.');}else toast('You need more money for that.')}},{label:'Ask for casual work',action:()=>doWork('Cafe Assistant',7000)}]}else if(b.type==='bank'){opts=[{label:'Check your balance',action:()=>toast('Your balance is ₦'+state.cash.toLocaleString('en-NG'))},{label:'Savings advice',action:()=>toast('Tip: save some of each payday for your house or business.')}]}else if(b.type==='property'){opts=[{label:'Rent a room (₦15,000)',action:()=>{if(state.cash>=15000){state.cash-=15000;state.house=true;toast('You rented a room in Benin City!')}else toast('You need ₦15,000. Work a few shifts first.')}},{label:'Buy a home (₦250,000)',action:()=>{if(state.cash>=250000){state.cash-=250000;state.house=true;toast('Congratulations! You bought a home.')}else toast('A home costs ₦250,000. Keep earning!')}},{label:'View neighbourhoods',action:()=>toast('Explore the city and choose where you want to settle.')}]}else if(b.type==='business'){opts=[{label:'Start a small business (₦40,000)',action:()=>{if(state.business){toast('You already own a business.');return}if(state.cash>=40000){state.cash-=40000;state.business=true;state.job='Business Owner';toast('Your business is open! Come back to collect daily profit.')}else toast('You need ₦40,000 to start. Save up first.')}},{label:'Collect daily profit (+₦7,000)',action:()=>{if(state.business){state.cash+=7000;toast('Business profit: ₦7,000.');}else toast('Start a business first.')}}]}else if(b.type==='gov'){opts=[{label:'Start a civic campaign',action:()=>{if(state.rep>=3){state.job='Community Leader';state.cash+=20000;toast('Your community campaign succeeded! Bonus ₦20,000.')}else toast('Build experience first: complete 3 paid shifts or activities.')}} ,{label:'Learn about leadership',action:()=>toast('Help people, work hard, and build a good reputation.')}]}else{opts=[{label:'Look for transport work',action:()=>doWork('Transport Assistant',9000)},{label:'Rest at the motor park',action:()=>toast('You take a short rest before continuing your day.')}]}openModal(b.name,b.desc,opts)}document.getElementById('interactBtn').onclick=interact;
function phone(){openModal('📱 Your Phone','Manage your Benin Life journey from here.',[{label:'💼 Career & work',action:()=>openModal('Career','Choose a path and work to earn money.',[{label:'Civil servant — ₦12,000/shift',action:()=>doWork('Civil Servant',12000)},{label:'Market trader — ₦8,000/shift',action:()=>doWork('Market Trader',8000)},{label:'Police officer — ₦11,000/shift',action:()=>doWork('Police Officer',11000)},{label:'Cafe assistant — ₦7,000/shift',action:()=>doWork('Cafe Assistant',7000)}])},{label:'🎒 Player status',action:()=>openModal('Player Status',`Day ${state.day}\nJob: ${state.job}\nCash: ₦${state.cash.toLocaleString('en-NG')}\nHome: ${state.house?'Yes':'Not yet'}\nBusiness: ${state.business?'Owner':'No'}\nReputation: ${state.rep}`, [{label:'Back to phone',action:phone}])},{label:'💰 Earn money: do a shift',action:()=>{if(state.job==='Unemployed')toast('Choose a job first in Career & work.');else{let pay=state.job==='Civil Servant'?12000:state.job==='Police Officer'?11000:state.job==='Market Trader'?8000:state.job==='Business Owner'?7000:7000;state.cash+=pay;state.day++;toast('Work done! +₦'+pay.toLocaleString()+' | Day '+state.day)}}},{label:'🏠 Find a house',action:()=>{closeModal();let b=buildings.find(x=>x.type==='property');state.x=b.x+b.w/2-70;state.y=b.y+b.h/2+85;toast('Follow the map to the Property Office.')}}])}document.getElementById('phoneBtn').onclick=phone;
function showMap(){let lines=buildings.map(b=>`${b.name} — ${Math.round(Math.hypot(state.x-(b.x+b.w/2),state.y-(b.y+b.h/2)))}m away`).join('\n');openModal('🗺️ Benin City Map','Nearby destinations:\n'+lines,[{label:'Go to City Hall',action:()=>goTo('office')},{label:'Go to Market',action:()=>goTo('market')},{label:'Go to Property Office',action:()=>goTo('property')},{label:'Go to Business Centre',action:()=>goTo('business')}])}function goTo(type){let b=buildings.find(x=>x.type===type);if(b){state.x=b.x+b.w/2-70;state.y=b.y+b.h/2+90;toast('You travelled to '+b.name+'.')}closeModal()}document.getElementById('mapBtn').onclick=showMap;
// gentle starter tutorial
setTimeout(()=>toast('Welcome to Benin Life! Use the arrows to move. Visit City Hall for a job.'),900);
})();
</script></body></html>
